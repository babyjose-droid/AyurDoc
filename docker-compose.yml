version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ayurcare_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ayurcare_dev
      POSTGRES_USER:     ayurcare
      POSTGRES_PASSWORD: ayurcare_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ayurcare -d ayurcare_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ayurcare_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional: Prisma Studio UI for DB inspection
  # Run: docker compose up studio
  studio:
    image: node:20-alpine
    container_name: ayurcare_studio
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && npx prisma studio"
    ports:
      - "5555:5555"
    environment:
      DATABASE_URL: postgresql://ayurcare:ayurcare_dev_password@postgres:5432/ayurcare_dev
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - studio

volumes:
  postgres_data:
  redis_data:
